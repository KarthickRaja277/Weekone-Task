[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoho-employee-data-service"
version = "0.1.0"
description = "A small employee data service for Yoho HR"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "python-dotenv",
  "openpyxl",
  "pymupdf",
  "fastapi",
  "uvicorn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
